version: "3"

services:
  nodejs:
    container_name: feelingsbingo
    restart: unless-stopped
    build: ./server/
    ports:
      - "3002:3002"
    env_file:
      - ./.env
    networks:
      - app-network
  mongo:
    container_name: mongo
    image: mongo
    restart: unless-stopped
    networks:
      - app-network
volumes:
  web-root:
    driver: local
    driver_opts:
      type: none
      device: /home/patrick/feelings-bingo/
      o: bind
networks:
  app-network:
    driver: bridge
